name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build, for example v1.0.0-B4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Windows release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
          }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup was not installed."
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, test, publish, and package
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch "^v") {
            throw "Release tags must start with v."
          }
          $version = $tag.Substring(1)
          & "$env:GITHUB_WORKSPACE\scripts\package-release.ps1" `
            -Version $version `
            -Runtime win-x64 `
            -RequireInstaller

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            $env:GITHUB_REF_NAME
          }
          $version = $tag.Substring(1)
          $assets = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\artifacts\release" -File |
            ForEach-Object { $_.FullName })
          $arguments = @(
            "release", "create", $tag,
            "--repo", "${{ github.repository }}",
            "--verify-tag",
            "--title", "Android TV Manager $version",
            "--generate-notes",
            "--notes", "Windows installer, portable build, and SHA-256 checksums are attached."
          )
          if ($version -match "-B\d+") {
            $arguments += "--prerelease"
          }
          $arguments += $assets
          & gh @arguments
